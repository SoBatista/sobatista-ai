[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sobatista-ai"
# Single authoritative version source. Release Please bumps this (and the
# source-checkout fallback in src/sobai/__init__.py) via a reviewed release PR.
version = "0.1.0.dev0"
description = "One CLI. Any model. Your tools. A provider-neutral AI command-line interface."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SoBatista" }]
keywords = ["ai", "cli", "llm", "anthropic", "openai", "ollama", "orchestration", "youtube", "notion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.5",
    "pydantic>=2.8",
    "httpx>=0.27",
    "rich>=13.7",
    "platformdirs>=4.2",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/SoBatista/sobatista-ai"
Repository = "https://github.com/SoBatista/sobatista-ai"
Documentation = "https://github.com/SoBatista/sobatista-ai#readme"
Changelog = "https://github.com/SoBatista/sobatista-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/SoBatista/sobatista-ai/issues"

[project.scripts]
sobai = "sobai.cli.app:main"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sobai"]

[tool.hatch.build.targets.sdist]
include = ["src/sobai", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "S",             # bandit-style security lints
    "ASYNC",         # async correctness
    "RUF",
]
ignore = [
    "S101",  # asserts are fine in tests (see per-file ignores below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "RUF012"]
# Constant names contain "token"/"endpoint"; these are keyring key names, not secrets.
"src/sobai/connectors/youtube/oauth.py" = ["S105"]
"src/sobai/connectors/notion/auth.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["sobai"]

[tool.mypy]
python_version = "3.12"
packages = ["sobai"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "tomli_w.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=sobai --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
# Allow tests to import the CI/release helper modules under scripts/.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: opt-in tests that call real external services (skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["sobai"]
omit = ["*/mcp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
