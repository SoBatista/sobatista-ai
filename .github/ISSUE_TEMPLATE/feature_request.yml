name: Feature request
description: Suggest an enhancement or a new provider/connector
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that sobai doesn't support yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        Command shape, flags, behavior. Keep the provider/connector split in
        mind (providers reason; connectors fetch data — they never couple).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security / privacy considerations
      description: >-
        Does this move data off the machine? New scopes? Read vs write? How does
        it behave under --local-only?
    validations:
      required: true
