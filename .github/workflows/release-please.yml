name: Release Please

# Prepares releases only: maintains a "release PR" that bumps the version and
# updates the changelog from Conventional Commits. Merging that PR is what tags
# and creates the GitHub Release (which in turn triggers release.yml). This
# workflow never publishes to PyPI and, on its own, creates no tag.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the release PR, tag, and GitHub Release
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          # A PAT (or GitHub App token) is required so that the Release created
          # when the release PR merges triggers release.yml; the built-in
          # GITHUB_TOKEN cannot trigger further workflow runs. Falls back to
          # GITHUB_TOKEN (release PR still works; publishing must then be run
          # manually via release.yml's workflow_dispatch). See RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please rewrites pyproject's [project].version but knows nothing
      # about uv.lock, which records that same version for the workspace package.
      # Without this, CI's "Lockfile consistency" job (`uv lock --check`) fails on
      # every release PR. Runs only when a release PR exists.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Sync uv.lock with the bumped version
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): sync uv.lock with the bumped version"
          git push
