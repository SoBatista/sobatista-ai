name: Release

# PREPARED BUT INERT. This workflow publishes a release; it only runs when a
# GitHub Release is published (normally by merging the Release Please PR) or when
# a maintainer manually dispatches it against an existing tag. It creates no tag
# and publishes nothing on its own. Publishing uses PyPI Trusted Publishing
# (OIDC) — there is NO long-lived API token anywhere in this repository.
#
# Recovery / re-run: this workflow is idempotent. PyPI upload uses
# skip-existing, so a re-run after a partial failure re-uploads only the missing
# files. GitHub Release asset upload uses --clobber. If a bad version reaches
# PyPI it cannot be replaced (immutability) — yank it on PyPI and ship a new
# patch version. See RELEASING.md for the full runbook.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build, verify, checksum, SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No caching in the publishing pipeline: a poisoned cache must not be
          # able to taint a release artifact (zizmor: cache-poisoning).
          enable-cache: false

      - name: Build sdist + wheel (once)
        run: uv build

      - name: Verify version matches the release tag
        run: uv run python scripts/check_version_tag.py "$RELEASE_TAG"

      - name: Validate distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Generate SHA-256 checksums
        run: uv run python scripts/gen_checksums.py dist

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m venv .sbomenv
          .sbomenv/bin/python -m pip install --quiet --upgrade pip
          .sbomenv/bin/python -m pip install --quiet dist/*.whl
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            --of JSON --output-reproducible \
            --pyproject pyproject.toml \
            -o sbom.cdx.json \
            .sbomenv/bin/python

      - name: Collect supply-chain metadata
        run: |
          set -euo pipefail
          mkdir -p supply-chain
          mv dist/SHA256SUMS supply-chain/
          mv sbom.cdx.json supply-chain/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain
          path: supply-chain/*
          if-no-files-found: error

  smoke:
    name: Install smoke (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install and smoke-test
        env:
          SOBAI_CONFIG_DIR: ${{ runner.temp }}/sobai-config
          SOBAI_DATA_DIR: ${{ runner.temp }}/sobai-data
          SOBAI_CACHE_DIR: ${{ runner.temp }}/sobai-cache
        run: |
          set -euo pipefail
          python -m venv .venv && . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            pip install dist/*.whl
          else
            pip install dist/*.tar.gz
          fi
          sobai --version
          sobai --help >/dev/null
          timeout 30 sobai </dev/null >/dev/null

  provenance:
    name: Attest build provenance
    runs-on: ubuntu-latest
    needs: [build, smoke]
    permissions:
      id-token: write # mint the OIDC token for signing
      attestations: write # persist the attestation
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

  github-release:
    name: Attach artifacts to the GitHub Release
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.event_name == 'release'
    permissions:
      contents: write # upload assets to the release
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Download supply-chain artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain
          path: supply-chain
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/* supply-chain/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [build, smoke, provenance]
    environment:
      name: pypi
      url: https://pypi.org/p/sobatista-ai
    permissions:
      id-token: write # OIDC for Trusted Publishing; NO API token is used
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Idempotent: tolerate files already present so a re-run after a
          # partial failure does not hard-fail (duplicate-publication guard).
          skip-existing: true
          print-hash: true
