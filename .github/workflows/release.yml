name: Release

# Releases are cut from the reviewed pull request. Every PR carries its own
# version bump (scripts/check_version.py enforces it), so a successful CI run on
# `main` is, by construction, a reviewed release candidate. This workflow builds
# and verifies it, creates the tag and GitHub Release from that version's
# reviewed changelog section, and only then publishes to PyPI.
#
# The trigger is `workflow_run` rather than `release: published` on purpose: a
# Release created by GITHUB_TOKEN cannot trigger another workflow, which is why
# publishing previously required a manual dispatch or a personal access token.
# Nothing here needs a PAT.
#
# Recovery / re-run: every step is idempotent. An existing tag must point at the
# same commit and is never moved; an existing Release is reused; PyPI upload uses
# skip-existing; asset upload uses --clobber. If a bad version reaches PyPI it
# cannot be replaced (immutability) — yank it and ship a new patch version.
# `workflow_dispatch` republishes an existing tag. See RELEASING.md.

# zizmor: ignore[dangerous-triggers]
# workflow_run is required here: a Release created by GITHUB_TOKEN cannot
# trigger another workflow, which is the whole reason publishing never fired
# under the previous design. The trigger is made safe by the `gate` job's
# conditions — success + `push` + same-repository, plus an ancestor-of-main
# proof — all evaluated before any code from the triggering run is fetched.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide what to release
    runs-on: ubuntu-latest
    # `workflow_run` runs on the default branch with write permission and OIDC
    # access, so every property of the triggering run is checked before any of
    # its code is fetched (zizmor: dangerous-triggers):
    #   * it must have succeeded — a red run is never a release candidate;
    #   * it must have been a `push`, so a fork's `pull_request` run cannot
    #     reach this job;
    #   * it must have come from this repository, not a fork.
    # `branches: [main]` alone is NOT sufficient: it matches the triggering
    # run's head branch, and a fork may name its branch `main`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.decide.outputs.ref }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      create_tag: ${{ steps.decide.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags: the guard compares against every existing tag.
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the commit is really on main
        if: github.event_name == 'workflow_run'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Defence in depth behind the trigger guards: refuse to release a
          # commit that is not an ancestor of main.
          git merge-base --is-ancestor "$SHA" origin/main

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Republishing an existing tag: it is already the release ref, and
            # the tag must not be recreated.
            python scripts/check_version_tag.py "$INPUT_TAG"
            {
              echo "ref=$INPUT_TAG"
              echo "tag=$INPUT_TAG"
              echo "create_tag=false"
            } >>"$GITHUB_OUTPUT"
          else
            # release.py validates consistency, refuses to move a tag, refuses a
            # version that is not newer, and writes tag/version/needs_release.
            python scripts/release.py --check
            echo "ref=$SHA" >>"$GITHUB_OUTPUT"
            sed -i 's/^needs_release=/create_tag=/' "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, verify, checksum, SBOM
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No caching in the publishing pipeline: a poisoned cache must not be
          # able to taint a release artifact (zizmor: cache-poisoning).
          enable-cache: false

      - name: Build sdist + wheel (once)
        run: uv build

      - name: Verify version matches the release tag
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: uv run python scripts/check_version_tag.py "$RELEASE_TAG"

      - name: Validate distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Generate SHA-256 checksums
        run: uv run python scripts/gen_checksums.py dist

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m venv .sbomenv
          .sbomenv/bin/python -m pip install --quiet --upgrade pip
          .sbomenv/bin/python -m pip install --quiet dist/*.whl
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            --of JSON --output-reproducible \
            --pyproject pyproject.toml \
            -o sbom.cdx.json \
            .sbomenv/bin/python

      - name: Collect supply-chain metadata
        run: |
          set -euo pipefail
          mkdir -p supply-chain
          mv dist/SHA256SUMS supply-chain/
          mv sbom.cdx.json supply-chain/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain
          path: supply-chain/*
          if-no-files-found: error

  smoke:
    name: Install smoke (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install and smoke-test
        env:
          SOBAI_CONFIG_DIR: ${{ runner.temp }}/sobai-config
          SOBAI_DATA_DIR: ${{ runner.temp }}/sobai-data
          SOBAI_CACHE_DIR: ${{ runner.temp }}/sobai-cache
        run: |
          set -euo pipefail
          python -m venv .venv && . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            pip install dist/*.whl
          else
            pip install dist/*.tar.gz
          fi
          sobai --version
          sobai --help >/dev/null
          timeout 30 sobai </dev/null >/dev/null

  provenance:
    name: Attest build provenance
    runs-on: ubuntu-latest
    needs: [gate, build, smoke]
    permissions:
      id-token: write # mint the OIDC token for signing
      attestations: write # persist the attestation
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

  tag-and-release:
    name: Tag and publish the GitHub Release
    runs-on: ubuntu-latest
    # Nothing is tagged until the artifacts are built, smoke-installed, and
    # attested — a broken build never gets a tag.
    needs: [gate, build, smoke, provenance]
    permissions:
      contents: write # create the tag and the release, and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 0
          # No ambient credentials in the tree; the tag push below supplies the
          # token through a credential helper (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create the tag and GitHub Release
        if: needs.gate.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The helper body is stored literally: git expands $GH_TOKEN when it
          # runs the helper, so the token never appears in argv or a remote URL.
          git config credential.helper \
            '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          python scripts/release.py --publish

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Download supply-chain artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain
          path: supply-chain

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/* supply-chain/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [gate, build, smoke, provenance, tag-and-release]
    environment:
      name: pypi
      url: https://pypi.org/p/sobatista-ai
    permissions:
      id-token: write # OIDC for Trusted Publishing; NO API token is used
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Idempotent: tolerate files already present so a re-run after a
          # partial failure does not hard-fail (duplicate-publication guard).
          skip-existing: true
          print-hash: true
