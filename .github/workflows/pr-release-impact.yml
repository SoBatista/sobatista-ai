name: PR release impact

# Every pull request must declare exactly one release impact
# (major / minor / patch / none) via the checkboxes in the PR template.
# The PR body is passed through an environment variable — never interpolated
# into the shell — so a crafted PR body cannot inject commands.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release-impact declaration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check exactly one release impact is selected
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python scripts/check_release_impact.py
