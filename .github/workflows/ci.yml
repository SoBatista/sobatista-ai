name: CI

# Continuous integration: lint, strict types, tests (no live APIs, no real
# credentials), distribution build + metadata validation, install smoke tests
# for both artifacts and both installers, strict docs build, and lockfile
# consistency. All third-party actions are pinned to full commit SHAs; Dependabot
# (see .github/dependabot.yml) proposes updates to those pins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs do not need more.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest (branch coverage; no live external APIs)
        # The default run excludes the opt-in `live` marker and uses no real
        # credentials, keyring, or network. The coverage floor is enforced by
        # pyproject's --cov-fail-under and may only be raised, never lowered.
        env:
          # Fail fast if any test unexpectedly reaches for a real config/state.
          SOBAI_CONFIG_DIR: ${{ runner.temp }}/sobai-config
          SOBAI_DATA_DIR: ${{ runner.temp }}/sobai-data
          SOBAI_CACHE_DIR: ${{ runner.temp }}/sobai-cache
        run: uv run pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build sdist + wheel
        run: uv build

      - name: Validate distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Reproducibility probe (informational)
        # Best-effort: rebuild with a pinned SOURCE_DATE_EPOCH and compare
        # hashes. Not fatal — surfaced so drift is visible, not silently ignored.
        continue-on-error: true
        run: |
          set -euo pipefail
          sha256sum dist/*.whl dist/*.tar.gz | sort > /tmp/build-1.txt
          rm -rf dist
          SOURCE_DATE_EPOCH=315532800 uv build
          sha256sum dist/*.whl dist/*.tar.gz | sort > /tmp/build-2.txt
          if diff -u /tmp/build-1.txt /tmp/build-2.txt; then
            echo "Build is reproducible for these settings."
          else
            echo "::notice::Build differs across runs; reproducibility not guaranteed."
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  install-smoke:
    name: Install smoke (${{ matrix.installer }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        installer: [pip-wheel, pip-sdist, uv-tool, pipx]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install the built artifact
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          SDIST=$(ls dist/*.tar.gz)
          case "${{ matrix.installer }}" in
            pip-wheel)
              python -m venv .venv && . .venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install "$WHEEL"
              echo "SMOKE=.venv/bin/sobai" >> "$GITHUB_ENV" ;;
            pip-sdist)
              python -m venv .venv && . .venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install "$SDIST"
              echo "SMOKE=.venv/bin/sobai" >> "$GITHUB_ENV" ;;
            uv-tool)
              python -m pip install --upgrade uv
              uv tool install "$WHEEL"
              echo "SMOKE=$HOME/.local/bin/sobai" >> "$GITHUB_ENV" ;;
            pipx)
              python -m pip install --upgrade pipx
              python -m pipx install "$WHEEL"
              # pipx honors PIPX_BIN_DIR (e.g. /opt/pipx_bin on GitHub runners),
              # which is not always ~/.local/bin — resolve it rather than assume.
              PIPX_BIN_DIR=$(python -m pipx environment --value PIPX_BIN_DIR)
              echo "SMOKE=$PIPX_BIN_DIR/sobai" >> "$GITHUB_ENV" ;;
          esac

      - name: Smoke-test the installed CLI
        # No credentials, keyring, or network. Interactive launch is exercised in
        # non-TTY mode, which must print guidance and exit without hanging.
        env:
          SOBAI_CONFIG_DIR: ${{ runner.temp }}/sobai-config
          SOBAI_DATA_DIR: ${{ runner.temp }}/sobai-data
          SOBAI_CACHE_DIR: ${{ runner.temp }}/sobai-cache
        run: |
          set -euo pipefail
          "$SMOKE" --version
          "$SMOKE" --help >/dev/null
          "$SMOKE" ask --help >/dev/null
          "$SMOKE" providers list >/dev/null
          # Non-TTY, no subcommand: must not hang; prints actionable guidance.
          timeout 30 "$SMOKE" </dev/null >/dev/null

  docs:
    name: Docs (mkdocs strict) + link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build documentation (strict)
        run: uv run --extra docs mkdocs build --strict

      - name: Check internal documentation links (offline)
        run: uv run python scripts/check_doc_links.py

  lockfile:
    name: Lockfile consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Verify uv.lock matches pyproject
        run: uv lock --check
